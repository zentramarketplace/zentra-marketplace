<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRA | Smart Shopping</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}
body {
background: #f4f7ff;
color: #14233d;
}

.container {
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 25px;
background: linear-gradient(145deg, #1355d8, #2479ff, #6eb6ff);
}

.card {
width: 100%;
max-width: 430px;
background: white;
border-radius: 28px;
overflow: hidden;
box-shadow: 0 15px 50px rgba(0,0,0,0.15);
  }
header {
padding: 35px 25px 15px;
text-align: center;
}

.logo {
font-size: 36px;
font-weight: 900;
letter-spacing: 3px;
color: #1558d6;
}

.logo span {
color: #182d50;
}

.tagline {
font-size: 13px;
color: #777;
margin-top: 8px;
letter-spacing: 1px;
}

.illustration {
padding: 25px 20px;
text-align: center;
  }
.illustration-box {
width: 100%;
height: 220px;
border-radius: 22px;
background: linear-gradient(135deg, #e5efff, #f5f9ff);
display: flex;
align-items: center;
justify-content: center;
}

.shopping-icon {
font-size: 110px;
}

.content {
padding: 10px 28px 35px;
text-align: center;
}

.content h1 {
font-size: 27px;
line-height: 1.4;
margin-bottom: 12px;
color: #172b4d;
}

.content p {
font-size: 15px;
color: #777;
line-height: 1.7;
margin-bottom: 28px;
  }
.buttons {
display: flex;
flex-direction: column;
gap: 14px;
}

button {
width: 100%;
padding: 17px;
border: none;
border-radius: 14px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
}

.begin {
background: #175bd8;
color: white;
}
.login {
background: #edf3ff;
color: #175bd8;
border: 1px solid #d5e2ff;
}

.footer {
text-align: center;
padding: 20px;
color: #aaa;
font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="header">
<div class="logo">ZEN<span>TRA</span></div>
<div class="tagline">SMART SHOPPING, BETTER LIVING.</div>
</div>
<div class="illustration">
<div class="illustration-box">
<div class="shopping-icon">🛍️</div>
</div>
</div>

<div class="content">
<h1>Welcome to ZENTRA</h1>

<p>
Discover amazing products, shop with ease
and enjoy a better shopping experience.
</p>

<div class="buttons">
<button class="begin" onclick="beginNow()">
Begin Now
</button>

<button class="login" onclick="loginNow()">
Login
</button>
</div>
</div>

</div>
<div class="footer">
ZENTRA · Shop Smarter. Live Better.
</div>

</div>

<script>
function beginNow() {
alert("Welcome to ZENTRA! Registration will be available soon.");
}

function loginNow() {
alert("ZENTRA Login will be available soon.");
}
</script>

</body>
</html>
