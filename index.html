<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRA Marketplace</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#f4f8fc;
 color:#17324d;
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
 border:none;
}

.hidden{
 display:none!important;
}

#app{
 min-height:100vh;
}

.auth-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 linear-gradient(rgba(255,255,255,.68),rgba(255,255,255,.68)),
 url('female.png');
 background-size:cover;
 background-position:center;
}

.auth-box{
 width:100%;
 max-width:430px;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);
 border-radius:20px;
 padding:28px;
 box-shadow:0 10px 40px rgba(30,100,180,.12);
 border:1px solid rgba(220,235,250,.8);
}

.logo{
 width:85px;
 height:85px;
 object-fit:contain;
 display:block;
 margin:0 auto 12px;
}

.brand{
 text-align:center;
 font-size:28px;
 font-weight:bold;
 color:#1684e8;
 letter-spacing:2px;
}

.brand-sub{
 text-align:center;
 font-size:13px;
 color:#667788;
 margin:6px 0 22px;
}

.auth-box h2{
 text-align:center;
 margin-bottom:20px;
 color:#17324d;
}

.field{
 margin-bottom:15px;
}

.field label{
 display:block;
 margin-bottom:7px;
 font-size:14px;
 font-weight:bold;
}

.field input,
.field select,
.field textarea{
 width:100%;
 padding:13px;
 border:1px solid #d8e2ec;
 border-radius:10px;
 outline:none;
 background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
 border-color:#69b5ff;
 box-shadow:0 0 0 2px rgba(105,181,255,.12);
}

.primary-btn{
 width:100%;
 padding:14px;
 border-radius:10px;
 background:#1684e8;
 color:white;
 font-weight:bold;
 transition:.2s;
}

.primary-btn:hover{
 background:#0872d1;
}

.auth-switch{
 text-align:center;
 margin-top:17px;
 font-size:14px;
}

.auth-switch span{
 color:#1684e8;
 font-weight:bold;
 cursor:pointer;
}

.forgot{
 text-align:right;
 font-size:13px;
 margin:10px 0 16px;
 color:#1684e8;
 cursor:pointer;
}

.auth-message{
 text-align:center;
 margin-top:12px;
 font-size:13px;
 color:#d32f2f;
}

@media(max-width:480px){
 .auth-box{
  padding:23px;
 }
}
</style>
</head>

<body>

<div id="app">

<!-- WELCOME PAGE -->
<section id="welcomePage" class="auth-page">

<div class="auth-box">

<img src="20261125_122020.png" class="logo"
onerror="this.style.display='none'">

<div class="brand">ZENTRA</div>
<div class="brand-sub">Marketplace</div>

<h2>Welcome</h2>

<button class="primary-btn"
onclick="showPage('loginPage')">
Login
</button>

<br><br>

<button class="primary-btn"
onclick="showPage('registerPage')">
Create Account
</button>

</div>
</section>


<!-- LOGIN PAGE -->
<section id="loginPage" class="auth-page hidden">

<div class="auth-box">

<img src="20261125_122020.png" class="logo"
onerror="this.style.display='none'">

<div class="brand">ZENTRA</div>
<div class="brand-sub">Marketplace</div>

<h2>Login</h2>

<div class="field">
<label>Email Address</label>
<input type="email" id="loginEmail"
placeholder="Enter email">
</div>

<div class="field">
<label>Password</label>
<input type="password" id="loginPassword"
placeholder="Enter password">
</div>

<div class="forgot"
onclick="showPage('forgotPage')">
Forgot Password?
</div>

<button class="primary-btn"
onclick="loginUser()">
Login
</button>

<div id="loginMessage" class="auth-message"></div>

<div class="auth-switch">
Don't have an account?
<span onclick="showPage('registerPage')">
Create Account
</span>
</div>

</div>
</section>


<!-- REGISTER PAGE -->
<section id="registerPage" class="auth-page hidden">

<div class="auth-box">

<img src="20261125_122020.png" class="logo"
onerror="this.style.display='none'">

<div class="brand">ZENTRA</div>
<div class="brand-sub">Marketplace</div>

<h2>Create Account</h2>

<div class="field">
<label>Full Name</label>
<input type="text" id="registerName"
placeholder="Enter full name">
</div>

<div class="field">
<label>Email Address</label>
<input type="email" id="registerEmail"
placeholder="Enter email">
</div>

<div class="field">
<label>Phone Number</label>
<input type="tel" id="registerPhone"
placeholder="Enter phone number">
</div>

<div class="field">
<label>Account Type</label>
<select id="registerRole">
<option value="buyer">Buyer</option>
<option value="seller">Seller</option>
</select>
</div>

<div class="field">
<label>Password</label>
<input type="password" id="registerPassword"
placeholder="Create password">
</div>

<div class="field">
<label>Confirm Password</label>
<input type="password" id="registerConfirm"
placeholder="Confirm password">
</div>

<button class="primary-btn"
onclick="registerUser()">
Create Account
</button>

<div id="registerMessage" class="auth-message"></div>

<div class="auth-switch">
Already have an account?
<span onclick="showPage('loginPage')">
Login
</span>
</div>

</div>
</section>


<!-- FORGOT PASSWORD -->
<section id="forgotPage" class="auth-page hidden">

<div class="auth-box">

<div class="brand">ZENTRA</div>
<div class="brand-sub">Marketplace</div>

<h2>Reset Password</h2>

<div class="field">
<label>Email Address</label>
<input type="email" id="resetEmail"
placeholder="Enter your email">
</div>

<button class="primary-btn"
onclick="resetPassword()">
Send Reset Link
</button>

<div id="resetMessage" class="auth-message"></div>

<div class="auth-switch">
<span onclick="showPage('loginPage')">
Back to Login
</span>
</div>

</div>
</section>

 </div>
