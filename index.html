<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRA | Smart Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}
html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    color: white;
    overflow-x: hidden;
}

.welcome {
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 25px;
    background:
        linear-gradient(
            180deg,
            rgba(0, 54, 190, 0.78),
            rgba(0, 35, 170, 0.90)
        ),
        url("file_0000000064348210808862c10ba5b1be.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
content {
    width: 100%;
    max-width: 450px;
    margin: auto;
}

.logo {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 12px;
    text-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

.logo span {
    color: #ffffff;
}

.tagline {
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 65px;
}

h1 {
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 20px;
}

.description {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 45px;
    color: #f0f5ff;
  }
.buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

button {
    width: 100%;
    min-height: 68px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
}

.begin {
    background: #ffffff;
    color: #0758e5;
    border: none;
}

.login {
    background: transparent;
    color: white;
    border: 2px solid white;
}

footer {
    margin-top: 50px;
    font-size: 13px;
    color: #e3eaff;
}

button:active {
    transform: scale(0.98);
}

@media (max-height: 700px) {
    .welcome {
        padding: 20px;
    }

    .logo {
        font-size: 42px;
    }

    .tagline {
        margin-bottom: 30px;
    }

    h1 {
        font-size: 26px;
    }

    .description {
        margin-bottom: 25px;
    }

    button {
        min-height: 58px;
    }

    .footer {
        margin-top: 25px;
    }
  }
</style>
</head>

<body>

<section class="welcome">

    <div class="content">

        <div class="logo">ZENTRA</div>

        <div class="tagline">
            Smart Shopping, Better Living.
        </div>

        <h1>Welcome to ZENTRA</h1>

        <p class="description">
            Discover amazing products, shop with ease
            and enjoy a better shopping experience.
        </p>
         <div class="buttons">

            <button class="begin" onclick="beginNow()">
                Begin Now &rarr;
            </button>

            <button class="login" onclick="loginNow()">
                Login
            </button>

        </div>

    </div>

    <div class="footer">
        &copy; 2026 ZENTRA. All rights reserved.
    </div>

</section>
<script>
function beginNow() {
    alert("Welcome to ZENTRA! Registration will be available soon.");
}

function loginNow() {
    alert("ZENTRA Login will be available soon.");
}
</script>

</body>
</html>
